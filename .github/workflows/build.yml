name: build-exe
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: PyInstaller
        run: pyinstaller --onefile --windowed --name KeyenceTifTool main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyenceTifTool-win64
          path: dist/KeyenceTifTool.exe
